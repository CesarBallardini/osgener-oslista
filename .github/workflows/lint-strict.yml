name: lint-strict

# Audit the sources against -std=mvs-strict using the portable copybook.
# The confidential job data is never pushed, so nothing here needs it.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gnucobol
      - run: make lint-strict
