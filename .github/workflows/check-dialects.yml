name: check-dialects

# Compile every source under all four dialect profiles: mvs, rm, mvs-strict, rm-strict.
# The confidential job data is never pushed, so nothing here needs it.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dialects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gnucobol
      - run: make check-dialects
